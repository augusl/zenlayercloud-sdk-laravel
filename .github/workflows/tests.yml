name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Drop write permissions — this workflow only reads code and reports test
# results. No issues, comments, or releases need to be created.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        exclude:
          # Drop combinations that are not officially supported by Laravel.
          - laravel: '13.*'
            php: '8.2'

    name: PHP ${{ matrix.php }} | Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, hash, mbstring
          coverage: none

      - name: Pin Laravel version
        run: |
          composer require \
            "illuminate/support:${{ matrix.laravel }}" \
            "illuminate/http:${{ matrix.laravel }}" \
            "illuminate/contracts:${{ matrix.laravel }}" \
            --no-update

      # Laravel 11 is past its security-fix window, so Composer >= 2.9 refuses
      # to resolve it while advisories remain open. Testing the LTS-tail leg is
      # exactly the point of this matrix entry, so disable the resolution block
      # for it only.
      - name: Allow advisory-affected framework (Laravel 11 leg only)
        if: matrix.laravel == '11.*'
        run: composer config policy.advisories.block false

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run test suite
        run: vendor/bin/phpunit

  lint:
    runs-on: ubuntu-latest
    name: Pint + PHPStan

    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, hash, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Pint (style check)
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
