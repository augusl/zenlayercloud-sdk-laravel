version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      laravel:
        patterns:
          - "illuminate/*"
          - "orchestra/*"
      dev-tools:
        patterns:
          - "phpunit/*"
          - "phpstan/*"
          - "laravel/pint"
          - "mockery/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
